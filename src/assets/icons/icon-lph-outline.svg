<svg class="itsa-lph-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 484 281" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Línea para el hogar">
  <style>
    .itsa-lph-icon .body{transition:fill .2s ease}
    .itsa-lph-icon .line{transition:stroke .2s ease}
    .itsa-lph-icon .accent,
    .itsa-lph-icon .accent-fill,
    .itsa-lph-icon .accent-line{transition:fill .2s ease,stroke .2s ease}
    button:hover .itsa-lph-icon .body,
    .itsa-lph-icon:hover .body{fill:#EA3D48}
    button:hover .itsa-lph-icon .line,
    .itsa-lph-icon:hover .line{stroke:#EA3D48}
    button:hover .itsa-lph-icon .accent,
    .itsa-lph-icon:hover .accent{stroke:#fff}
    button:hover .itsa-lph-icon .accent-fill,
    .itsa-lph-icon:hover .accent-fill{fill:#fff}
    button:hover .itsa-lph-icon .accent-line,
    .itsa-lph-icon:hover .accent-line{stroke:#EA3D48}
  </style>

  <!-- Refrigerator -->
  <g class="body" fill="#374151">
    <rect x="23" y="23" width="115" height="131" rx="3"/>
    <rect x="23" y="159" width="115" height="114" rx="3"/>
    <rect x="22" y="154" width="117" height="5"/>
  </g>
  <g fill="none" stroke="white" stroke-width="2">
    <path d="M35 95 L35 126"/>
    <path d="M31 109 L39 109"/>
  </g>
  <!-- snowflake -->
  <g class="accent" stroke="#EA3D48" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M80 183 V247 M50 215 H110"/>
    <path d="M59 194 L101 236 M101 194 L59 236"/>
    <path d="M80 183 l-5 8 M80 183 l5 8 M80 247 l-5-8 M80 247 l5-8"/>
    <path d="M50 215 l9-3 M50 215 l9 3 M110 215 l-9-3 M110 215 l-9 3"/>
    <path d="M59 194 l2 9 M59 194 l9 3 M101 194 l-2 9 M101 194 l-9 3"/>
    <path d="M59 236 l2-9 M59 236 l9-3 M101 236 l-2-9 M101 236 l-9-3"/>
  </g>

  <!-- Oven / stove -->
  <g class="body" fill="#374151">
    <rect x="149" y="76" width="174" height="199" rx="6"/>
    <rect x="158" y="73" width="59" height="7" rx="3"/>
    <rect x="224" y="73" width="84" height="7" rx="3"/>
    <rect x="151" y="103" width="171" height="6" fill="white"/>
  </g>
  <g fill="white">
    <rect x="166" y="84" width="57" height="15" rx="2"/>
    <rect x="232" y="84" width="57" height="15" rx="2"/>
  </g>
  <g class="body" fill="#374151">
    <circle cx="248" cy="92" r="5"/>
    <circle cx="260" cy="92" r="5"/>
    <circle cx="272" cy="92" r="5"/>
    <circle cx="284" cy="92" r="5"/>
  </g>
  <g fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <path d="M172 137 H294"/>
    <rect x="169" y="148" width="135" height="109" rx="4"/>
  </g>
  <g fill="none" class="line" stroke="#374151" stroke-width="3" stroke-linecap="round">
    <path d="M179 157 L178 199"/>
    <path d="M178 157 L229 156"/>
    <path d="M170 237 H301"/>
  </g>

  <!-- Washing machine -->
  <g class="body" fill="#374151">
    <rect x="335" y="78" width="144" height="196" rx="6"/>
    <rect x="346" y="83" width="40" height="15" rx="5" fill="white"/>
  </g>
  <g fill="white">
    <circle cx="427" cy="90" r="5"/>
    <circle cx="440" cy="90" r="5"/>
    <circle cx="457" cy="90" r="5"/>
  </g>
  <circle class="accent" cx="407" cy="199" r="49" fill="none" stroke="#EA3D48" stroke-width="7"/>
  <circle class="accent-fill" cx="407" cy="199" r="30" fill="#EA3D48"/>
  <path class="accent-line" d="M379 199 A30 30 0 0 1 409 170" fill="none" stroke="#fff" stroke-width="3"/>
</svg>