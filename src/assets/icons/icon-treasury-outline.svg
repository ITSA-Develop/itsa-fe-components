<svg class="itsa-treasury-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 348 348" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Tesorería">
  <style>
    .itsa-treasury-icon .body{transition:fill .2s ease}
    .itsa-treasury-icon .line{transition:stroke .2s ease}
    .itsa-treasury-icon .money{transition:fill .2s ease}
    .itsa-treasury-icon .dollar{transition:stroke .2s ease}
    button:hover .itsa-treasury-icon .body,
    .itsa-treasury-icon:hover .body{fill:#EA3D48}
    button:hover .itsa-treasury-icon .line,
    .itsa-treasury-icon:hover .line{stroke:#EA3D48}
    button:hover .itsa-treasury-icon .money,
    .itsa-treasury-icon:hover .money{fill:#fff}
    button:hover .itsa-treasury-icon .dollar,
    .itsa-treasury-icon:hover .dollar{stroke:#EA3D48}
  </style>

  <!-- Roof -->
  <path d="M14 82 L155 17 Q174 8 193 17 L334 82 Q341 85 334 86 H14 Q7 85 14 82Z" class="body" fill="#374151"/>

  <!-- Check mark -->
  <path d="M131 52 L149 70 Q153 74 158 69 L191 35 Q196 30 191 25 Q186 20 181 25 L154 52 L141 39 Q136 34 131 39 Q126 44 131 52Z"
        fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Upper horizontal bank structure -->
  <path d="M21 91 H99 Q103 91 103 96 V101 Q103 106 98 106 H25"
        fill="none" class="line" stroke="#374151" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 91 H326 Q330 91 330 96 V101 Q330 106 325 106 H249"
        fill="none" class="line" stroke="#374151" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main building -->
  <rect x="78" y="111" width="192" height="180" class="body" fill="#374151"/>

  <!-- Left column -->
  <rect x="42" y="124" width="35" height="161" rx="5" class="body" fill="#374151"/>
  <path d="M59 144 V264" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Right column -->
  <rect x="271" y="124" width="35" height="161" rx="5" class="body" fill="#374151"/>
  <path d="M289 144 V264" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Column capitals -->
  <rect x="35" y="108" width="54" height="13" rx="5" class="body" fill="#374151"/>
  <rect x="259" y="108" width="54" height="13" rx="5" class="body" fill="#374151"/>

  <!-- Money bag -->
  <path d="M151 108 Q148 108 146 113 L157 132 Q174 127 191 132 L202 113 Q204 108 198 108 Z"
        class="body" fill="#374151" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
  <path d="M164 131 L164 115 M184 131 L184 115" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <path d="M173 134
           C143 134 122 153 122 184
           V239
           C122 267 143 280 173 280
           C203 280 224 267 224 239
           V184
           C224 153 203 134 173 134Z"
        class="money" fill="#EA3D48" stroke="#fff" stroke-width="6"/>

  <!-- Dollar sign -->
  <path d="M174 166 V181
           M174 181 C164 178 154 182 154 192
           C154 202 164 205 174 205
           C184 205 193 209 193 219
           C193 229 184 233 174 230
           M174 230 V245"
        class="dollar" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>

  <!-- Base -->
  <rect x="19" y="293" width="302" height="16" rx="3" class="body" fill="#374151"/>
  <rect x="10" y="313" width="321" height="21" rx="3" class="body" fill="#374151"/>
</svg>